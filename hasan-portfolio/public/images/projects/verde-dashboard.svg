<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">VERDÉ AI commerce dashboard</title>
  <desc id="desc">A dark green commerce interface showing a curated product grid and an AI styling assistant.</desc>
  <rect width="1600" height="1000" rx="32" fill="#07120f"/>
  <rect x="48" y="48" width="1504" height="904" rx="24" fill="#0e1d18" stroke="#284b3d"/>
  <text x="100" y="125" fill="#d9f7e8" font-family="Arial, sans-serif" font-size="34" font-weight="700">VERDÉ</text>
  <text x="100" y="164" fill="#8db9a4" font-family="Arial, sans-serif" font-size="18">A considered marketplace for a better everyday.</text>
  <rect x="100" y="220" width="980" height="74" rx="18" fill="#142a22" stroke="#315b49"/>
  <text x="132" y="266" fill="#a9d6bd" font-family="Arial, sans-serif" font-size="22">Ask VERDÉ: find a calm, sustainable desk setup</text>
  <rect x="1110" y="220" width="340" height="74" rx="18" fill="#7ce0ad"/>
  <text x="1200" y="266" fill="#082015" font-family="Arial, sans-serif" font-size="22" font-weight="700">Curate for me</text>
  <text x="100" y="365" fill="#d9f7e8" font-family="Arial, sans-serif" font-size="28" font-weight="700">Curated for your intent</text>
  <g>
    <rect x="100" y="405" width="300" height="360" rx="18" fill="#18352a"/>
    <rect x="430" y="405" width="300" height="360" rx="18" fill="#1b302b"/>
    <rect x="760" y="405" width="300" height="360" rx="18" fill="#263126"/>
    <rect x="1090" y="405" width="360" height="360" rx="18" fill="#12271f" stroke="#7ce0ad"/>
  </g>
  <g fill="#b7dfc7" font-family="Arial, sans-serif">
    <text x="130" y="690" font-size="22">Linen overshirt</text><text x="130" y="730" font-size="18" fill="#7ce0ad">Built to last · $84</text>
    <text x="460" y="690" font-size="22">Stoneware set</text><text x="460" y="730" font-size="18" fill="#7ce0ad">Low-impact · $42</text>
    <text x="790" y="690" font-size="22">Oak desk lamp</text><text x="790" y="730" font-size="18" fill="#7ce0ad">Repairable · $116</text>
    <text x="1130" y="470" font-size="20" fill="#7ce0ad">AI STYLING NOTE</text>
    <text x="1130" y="525" font-size="24">Soft textures, warm light,</text><text x="1130" y="560" font-size="24">and fewer, better objects.</text>
    <text x="1130" y="650" font-size="18" fill="#8db9a4">3 picks · 1 considered cart</text>
  </g>
  <g fill="#426c58" opacity=".55"><circle cx="250" cy="520" r="72"/><circle cx="580" cy="520" r="72"/><circle cx="910" cy="520" r="72"/></g>
</svg>
